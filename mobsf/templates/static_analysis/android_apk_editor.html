{% load i18n static %}
{% if app_type == 'apk' or apk_editor_standalone %}
<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-12">
        <div class="card" id="apk-editor"
             data-hash="{{ md5 }}"
             data-upload-url="{% url 'apk_editor_upload' %}"
             data-start-url="{% url 'apk_editor_start' %}"
             data-discard-url="{% url 'apk_editor_discard' %}"
             data-frida-url="{% url 'apk_editor_frida_gadget' %}"
             data-obfuscate-url="{% url 'apk_editor_obfuscate' %}"
             data-save-url="{% url 'apk_editor_save' %}"
             data-download-url="{% url 'apk_editor_download' %}"
             data-logs-url="{% url 'apk_editor_logs' %}"
             data-msg-starting="{% trans 'Entering edit mode' %}"
             data-msg-start-failed="{% trans 'Failed to enter edit mode' %}"
             data-msg-editing="{% trans 'Editing. All operations will be saved to the current session.' %}"
             data-msg-uploading="{% trans 'Uploading APK' %}"
             data-msg-upload-failed="{% trans 'Failed to upload APK' %}"
             data-msg-upload-done="{% trans 'APK uploaded. Editing session created.' %}"
             data-msg-no-session="{% trans 'No active editor session' %}"
             data-msg-discard-failed="{% trans 'Failed to discard edit session' %}"
             data-msg-discarded="{% trans 'Edit session discarded' %}"
             data-msg-frida-starting="{% trans 'Injecting Frida Gadget' %}"
             data-msg-frida-failed="{% trans 'Failed to inject Frida Gadget' %}"
             data-msg-frida-done="{% trans 'Frida Gadget injected' %}"
             data-msg-obfuscating="{% trans 'Running obfuscation' %}"
             data-msg-obfuscate-failed="{% trans 'Failed to run obfuscation' %}"
             data-msg-obfuscate-done="{% trans 'Obfuscation complete' %}"
             data-msg-saving="{% trans 'Saving and signing' %}"
             data-msg-save-failed="{% trans 'Failed to save APK' %}"
             data-msg-closed-no-changes="{% trans 'No changes. Edit session closed.' %}"
             data-msg-saved="{% trans 'Saved. Download edited APK.' %}">
          <div class="card-body">
            <p><strong><i class="fas fa-edit"></i> {% trans 'APK Editor' %}</strong></p>
            {% if apk_editor_standalone %}
            <form id="apk-editor-upload" class="mb-3" enctype="multipart/form-data" method="post">
              {% csrf_token %}
              <div class="input-group">
                <div class="custom-file">
                  <input type="file" class="custom-file-input" id="apk-editor-file" name="file" accept=".apk">
                  <label class="custom-file-label" for="apk-editor-file">{% trans 'Select APK' %}</label>
                </div>
                <div class="input-group-append">
                  <button type="submit" class="btn btn-primary" id="apk-editor-upload-button">
                    <i class="fas fa-upload"></i> {% trans 'Upload APK' %}
                  </button>
                </div>
              </div>
              <div class="mt-2 d-none" id="apk-editor-upload-progress">
                <div class="progress" style="height: 1.25rem;">
                  <div class="progress-bar progress-bar-striped progress-bar-animated"
                       id="apk-editor-upload-progress-bar"
                       role="progressbar"
                       aria-label="{% trans 'Upload progress' %}"
                       aria-valuemin="0"
                       aria-valuemax="100"
                       aria-valuenow="0"
                       style="width: 0%;">0%</div>
                </div>
                <small class="text-muted" id="apk-editor-upload-progress-text">0%</small>
              </div>
            </form>
            {% endif %}
            <div id="apk-editor-status" class="alert alert-secondary">
              {% trans 'Not editing' %}
            </div>
            <div class="btn-group flex-wrap" role="group">
              <button type="button" class="btn btn-primary" id="apk-editor-start">
                <i class="fas fa-edit"></i> {% trans 'Edit APK' %}
              </button>
              <button type="button" class="btn btn-info" id="apk-editor-frida" disabled>
                <i class="fas fa-plug"></i> {% trans 'Inject Frida Gadget' %}
              </button>
              <button type="button" class="btn btn-warning" id="apk-editor-obfuscate" disabled>
                <i class="fas fa-random"></i> {% trans 'Run Obfuscation' %}
              </button>
              <button type="button" class="btn btn-success" id="apk-editor-save" disabled>
                <i class="fas fa-save"></i> {% trans 'Save' %}
              </button>
              <button type="button" class="btn btn-danger" id="apk-editor-discard" disabled>
                <i class="fas fa-trash"></i> {% trans 'Discard Edit' %}
              </button>
              <a class="btn btn-secondary disabled" id="apk-editor-download" href="#">
                <i class="fas fa-download"></i> {% trans 'Download Edited APK' %}
              </a>
            </div>
            <pre class="mt-3 d-none" id="apk-editor-log"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script src="{% static 'others/js/apk_editor.js' %}"></script>
{% endif %}
